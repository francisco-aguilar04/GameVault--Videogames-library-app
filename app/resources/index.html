<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GameVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/resources/css/index.css">
    <script defer src="/resources/js/app.js"></script>
</head>
<body class="bg-dark text-light">

    <header class="bg-black border-bottom border-secondary py-3 px-4">
        <h1 class="h4 fw-bold mb-0">GameVault</h1>
    </header>

    <main class="container-fluid py-4">

        <div id="games-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 g-3">
            <p class="text-secondary">Cargando juegos...</p>
        </div>

        <template id="game-card-template">

            <div class="col">

                <div class="card bg-secondary shadow bg-opacity-25 border-secondary h-100">

                    <div class="position-relative">
                        <img class="card-img-top img-fluid game-cover">
                        <span class="badge position-absolute top-0 start-0 m-2 game-status"></span>
                    </div>

                    <div class="card-body p-2">
                        <p class="card-title fw-bold mb-1 fs-4 text-center text-light game-title"></p>
                        <p class="game-genres"></p>
                        <p class="text-secondary small mb-1 game-year"></p>
                        <p class="mb-1 text-warning game-stars"></p>
                        <div class="game-pills"></div>
                    </div>

                </div>

            </div>

        </template>

    </main>
</body>
</html>
