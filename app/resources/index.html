<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GameVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/resources/css/index.css">
    <script defer src="/resources/js/app.js"></script>
</head>
<body class="bg-dark text-light">

    <header class="bg-black border-bottom border-secondary py-3 px-4">
        <h1 class="h4 fw-bold mb-0">GameVault</h1>
    </header>

    <main class="container-fluid py-4 px-4">

        <div id="games-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 gy-4 gx-3">
    
            <div class="position-fixed top-50 start-50 translate-middle text-center w-100">
                <p class="text-secondary fs-3 mb-0">Cargando juegos...</p>
            </div>

        </div>

        <template id="game-card-template">

            <div class="col">

                <div class="card bg-secondary shadow bg-opacity-25 border-secondary rounded-4 h-100">

                    <div class="position-relative overflow-hidden">
                        <img class="card-img-top img-fluid game-cover">
                        <span class="badge position-absolute top-0 start-0 m-2 game-status"></span>
                    </div>

                    <div class="card-body p-3 d-flex flex-column">
                        <p class="card-title fw-bold text-light text-center fs-5 mb-1 game-title"></p>

                        <div class="d-flex align-items-center gap-2 mb-1 mt-auto game-meta-row">
                            <span class="text-secondary small game-year"></span>
                            <span class="text-secondary small game-separator">•</span>
                            <div class="d-flex gap-1 game-genres"></div>
                        </div>

                        <div class="game-pills mb-2 mt-1"></div>

                        <p class="mb-0 text-warning game-stars"></p>
                    </div>

                </div>

            </div>

        </template>

    </main>
</body>
</html>
