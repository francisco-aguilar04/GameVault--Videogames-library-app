<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GameVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/resources/css/index.css">
    <link rel="stylesheet" href="/resources/css/header.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="/resources/js/app.js"></script>
    <script defer src="/resources/js/edit.js"></script>
</head>

<body class="bg-dark text-light vh-100 d-flex flex-column overflow-hidden">

    <div id="header-placeholder"></div>

    <main class="container-fluid pb-4 pt-3 px-4 flex-grow-1 overflow-y-auto">

        <div class="container mb-4 mx-0">
            <div class="row">

                <div class="col-auto ps-0">

                    <div class="input-group">

                        <button class="btn btn-primary" type="button" onclick="handleTitleSearch()">
                            <i class="bi bi-search"></i>
                        </button>

                        <input type="text" id="title-search" class="form-control" maxlength="41"
                            placeholder="Buscar...">
                    </div>

                </div>

                <div class="col-auto d-flex px-0">

                    <button type="button"
                        class="btn btn-primary btn-sm text-white fw-bold rounded-3 px-2 py-1 shadow-sm me-1"
                        onclick="filterGamesByStatus('todos')">Todos</button>

                    <button type="button"
                        class="btn btn-primary btn-sm text-white fw-bold rounded-3 px-2 py-1 shadow-sm mx-1"
                        onclick="filterGamesByStatus('completado')">Completados</button>

                    <button type="button"
                        class="btn btn-primary btn-sm text-white fw-bold rounded-3 px-2 py-1 shadow-sm mx-1"
                        onclick="filterGamesByStatus('jugando')">Jugando</button>

                    <button type="button"
                        class="btn btn-primary btn-sm text-white fw-bold rounded-3 px-2 py-1 shadow-sm ms-1"
                        onclick="filterGamesByStatus('pendiente')">Sin jugar</button>

                </div>

                <div class="col-auto">

                    <select id="platform-filter" class="form-select" onchange="filterGamesByPlatform(this.value)">
                        <option value="">Todas las plataformas</option>
                    </select>

                </div>

                <div class="col-auto px-0">

                    <select id="genre-filter" class="form-select" onchange="filterGamesByGenre(this.value)">
                        <option value="">Todos los géneros</option>
                    </select>

                </div>

                <div class="col-auto  d-flex">
                    <button class="btn btn-primary btn-sm text-white fw-bold rounded-3 ps-3 pe-2 py-1 shadow-sm me-1"
                        type="button" id="sort-toggle" onclick="toggleSort()">
                        A-Z<i class="bi bi-arrow-down"></i>
                    </button>
                </div>

                <div class="col-auto d-flex px-0">
                    <button class="btn btn-primary btn-sm text-white fw-bold rounded-3 px-2 py-1 shadow-sm me-1"
                        type="button" id="rating-sort-toggle" onclick="toggleRatingSort()">
                        ★<i class="bi bi-arrow-down"></i>
                    </button>
                </div>

            </div>
        </div>

        <div id="games-grid" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 gy-4 gx-3">

            <div class="position-fixed top-50 start-50 translate-middle text-center w-100">
                <p class="text-secondary fs-3 mb-0">Cargando juegos...</p>
            </div>

        </div>

        <template id="game-card-template">

            <div class="col">

                <div class="card bg-secondary shadow bg-opacity-25 border-secondary rounded-4 h-100">

                    <div class="position-relative overflow-hidden">
                        <img class="card-img-top img-fluid game-cover">
                        <span class="badge position-absolute top-0 start-0 m-2 game-status"></span>
                    </div>

                    <div class="card-body p-2 d-flex flex-column">
                        <p class="card-title fw-bold text-light text-center fs-5 mb-1 game-title"></p>

                        <div class="d-flex align-items-center gap-2 mb-1 mt-auto game-meta-row">
                            <span class="text-light text-opacity-50 small game-year"></span>
                            <span class="text-light text-opacity-50 small game-separator">•</span>
                            <div class="text-light text-opacity-50 small d-flex gap-1 game-genres"></div>
                        </div>

                        <div class="game-pills mb-2 mt-1"></div>

                        <p class="mb-0 text-warning game-stars"></p>
                    </div>

                </div>

            </div>

        </template>

        <div class="modal fade" id="edit-game-modal" tabindex="-1">

            <div class="modal-dialog modal-lg modal-dialog-centered">

                <div class="modal-content bg-dark text-light">

                    <div class="position-relative edit-hero">
                        <img id="edit-hero-img" class="w-100" style="height: 220px; object-fit: cover;">
                        <div class="edit-hero-overlay"></div>

                        <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
                            data-bs-dismiss="modal"></button>

                        <div class="position-absolute bottom-0 start-0 end-0 p-3">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                <span id="edit-hero-status" class="badge"></span>
                                <span id="edit-hero-meta" class="small text-white fw-bold"></span>
                            </div>
                            <h2 id="edit-hero-title" class="fw-bold mb-1"></h2>
                            <div class="d-flex align-items-center gap-2">
                                <span id="edit-hero-rating" class="small fw-bold text-warning"></span>
                                <div id="edit-hero-platforms" class="d-flex gap-1"></div>
                            </div>
                        </div>
                    </div>

                    <div class="modal-body">
                        <ul class="nav nav-tabs border-secondary mb-3" id="edit-tabs">
                            <li class="nav-item">
                                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-edit"
                                    type="button">
                                    Editar
                                </button>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-review"
                                    type="button">
                                    Reseña
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <div class="tab-pane fade show active" id="tab-edit">
                                <form id="edit-game-form">
                                    <input type="hidden" id="edit-game-id">
                                    <div class="mb-2">
                                        <label class="form-label small">Título</label>
                                        <input type="text" id="edit-title-input"
                                            class="form-control bg-secondary text-light border-dark" required
                                            maxlength="255">
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-4">
                                            <label class="form-label small">Estado</label>
                                            <select id="edit-status-input"
                                                class="form-select bg-secondary text-light border-dark">
                                                <option value="pendiente">Pendiente</option>
                                                <option value="jugando">Jugando</option>
                                                <option value="completado">Completado</option>
                                            </select>
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small">Año</label>
                                            <input type="number" id="edit-year-input"
                                                class="form-control bg-secondary text-light border-dark" min="1950">
                                        </div>
                                        <div class="col-4">
                                            <label class="form-label small">Rating</label>
                                            <input type="number" id="edit-rating-input"
                                                class="form-control bg-secondary text-light border-dark" min="0" max="5"
                                                step="0.5">
                                        </div>
                                    </div>
                                    <div class="mb-2">
                                        <label class="form-label small">URL de la foto</label>
                                        <input type="url" id="edit-photo-input"
                                            class="form-control bg-secondary text-light border-dark">
                                    </div>
                                    <div class="row mb-2">
                                        <div class="col-6">
                                            <label class="form-label small">Plataformas</label>
                                            <div id="edit-platforms-input"
                                                class="form-select bg-secondary text-light border-dark" multiple
                                                size="4"></div>
                                        </div>
                                        <div class="col-6">
                                            <label class="form-label small">Géneros</label>
                                            <div id="edit-genres-input"
                                                class="form-select bg-secondary text-light border-dark" multiple
                                                size="4"></div>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            <div class="tab-pane fade" id="tab-review">
                                <label class="form-label small">Tu reseña</label>
                                <textarea id="edit-review-input"
                                    class="form-control bg-secondary text-light border-dark" rows="6"></textarea>
                            </div>
                        </div>

                        <p id="edit-form-message" class="small mb-0 mt-2"></p>
                    </div>

                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-danger me-auto" id="edit-delete-btn">
                            <i class="bi bi-trash"></i> Borrar
                        </button>
                        <button type="button" class="btn btn-outline-primary" id="edit-save-btn">Guardar
                            cambios</button>
                    </div>

                </div>
            </div>
        </div>

    </main>
</body>

</html>
