<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GameVault - Estadísticas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/resources/css/index.css">
    <link rel="stylesheet" href="/resources/css/header.css">
    <link rel="stylesheet" href="/resources/css/stats.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="/resources/js/app.js"></script>
    <script defer src="/resources/js/stats.js"></script>
</head>

<body class="bg-dark text-light v d-flex flex-column overflow-hidden">

    <div id="header-placeholder"></div>

    <main class="container-fluid py-4">

        <h2 class="h4 fw-bold mb-4">Estadísticas</h2>

        <div class="row row-cols-3 row-cols-md-4 row-cols-lg-3 row-cols-xl-3 g-3 justify-content-center">
            <div class="col">
                <div class="card stat-card h-100 text-center p-2 bg-secondary">
                    <p class="fs-4 text-white mb-1 text-uppercase opacity-75">Total juegos</p>
                    <p class="fs-2 fw-bold mb-0 text-white stat-total"></p>
                </div>
            </div>

            <div class="col">
                <div class="card stat-card h-100 text-center p-2 bg-secondary">
                    <p class="fs-4 text-white mb-1 text-uppercase opacity-75">Completados</p>
                    <p class="fs-2 fw-bold mb-0 text-success stat-completed"></p>
                </div>
            </div>

            <div class="col">
                <div class="card stat-card h-100 text-center p-2 bg-secondary">
                    <p class="fs-4 text-white mb-1 text-uppercase opacity-75">Jugando</p>
                    <p class="fs-2 fw-bold mb-0 text-primary stat-playing"></p>
                </div>
            </div>

            <div class="col">
                <div class="card stat-card h-100 text-center p-2 bg-secondary">
                    <p class="fs-4 text-white mb-1 text-uppercase opacity-75">Sin jugar</p>
                    <p class="fs-2 fw-bold mb-0 text-danger stat-pending"></p>
                </div>
            </div>

            <div class="col">
                <div class="card stat-card h-100 text-center p-2 bg-secondary">
                    <p class="fs-4 text-white mb-1 text-uppercase opacity-75">Media</p>
                    <p class="fs-2 fw-bold mb-0 text-warning stat-average"></p>
                </div>
            </div>

            <div class="col">
                <div class="card stat-card h-100 text-center p-2 bg-secondary">
                    <p class="fs-4 text-white mb-1 text-uppercase opacity-75">Género top</p>
                    <p class="fs-2 fw-bold mb-0 text-info stat-top-genre"></p>
                </div>
            </div>
        </div>

        <div class="card stat-card p-3 mt-4" style="max-width: 500px;">
            <p class="text-white text-uppercase fw-bold opacity-75 mb-3">Distribución de puntuaciones</p>
            <div id="rating-bars"></div>
        </div>

    </main>

</body>

</html>
