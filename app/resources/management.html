<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GameVault - Gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/resources/css/index.css">
    <link rel="stylesheet" href="/resources/css/header.css">
    <link rel="stylesheet" href="/resources/css/management.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="/resources/js/app.js"></script>
    <script defer src="/resources/js/management.js"></script>
</head>

<body class="bg-dark text-light">

    <div id="header-placeholder"></div>

    <main class="container-fluid py-4">
        <h2 class="h4 fw-bold mb-4">Gestión</h2>

        <div class="accordion" id="management-accordion">

            <div class="accordion-item stat-card">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#panel-add-game">
                        <i class="bi bi-plus-circle me-2"></i> Añadir juego
                    </button>
                </h2>
                <div id="panel-add-game" class="accordion-collapse collapse" data-bs-parent="#management-accordion">
                    <div class="accordion-body">
                        <div id="add-game-form"></div>
                    </div>
                </div>
            </div>

            <div class="accordion-item stat-card">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#panel-add-platform">
                        <i class="bi bi-plus-circle me-2"></i> Añadir plataforma
                    </button>
                </h2>
                <div id="panel-add-platform" class="accordion-collapse collapse" data-bs-parent="#management-accordion">
                    <div class="accordion-body">
                        <div id="add-platform-form"></div>
                    </div>
                </div>
            </div>

            <div class="accordion-item stat-card">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#panel-manage-platforms">
                        <i class="bi bi-controller me-2"></i> Gestionar plataformas
                    </button>
                </h2>
                <div id="panel-manage-platforms" class="accordion-collapse collapse"
                    data-bs-parent="#management-accordion">
                    <div class="accordion-body">
                        <div id="platforms-table"></div>
                    </div>
                </div>
            </div>

            <div class="accordion-item stat-card">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#panel-add-genre">
                        <i class="bi bi-plus-circle me-2"></i> Añadir género
                    </button>
                </h2>
                <div id="panel-add-genre" class="accordion-collapse collapse" data-bs-parent="#management-accordion">
                    <div class="accordion-body">
                        <div id="add-genre-form"></div>
                    </div>
                </div>
            </div>

            <div class="accordion-item stat-card">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#panel-manage-genres">
                        <i class="bi bi-tags me-2"></i> Gestionar géneros
                    </button>
                </h2>
                <div id="panel-manage-genres" class="accordion-collapse collapse"
                    data-bs-parent="#management-accordion">
                    <div class="accordion-body">
                        <div id="genres-table"></div>
                    </div>
                </div>
            </div>

            <div class="accordion-item stat-card">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#panel-add-wishlist">
                        <i class="bi bi-heart me-2"></i> Añadir a wishlist
                    </button>
                </h2>
                <div id="panel-add-wishlist" class="accordion-collapse collapse" data-bs-parent="#management-accordion">
                    <div class="accordion-body">
                        <div id="add-wishlist-form"></div>
                    </div>
                </div>
            </div>

            <div class="accordion-item stat-card">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                        data-bs-target="#panel-export">
                        <i class="bi bi-download me-2"></i> Exportar CSV
                    </button>
                </h2>
                <div id="panel-export" class="accordion-collapse collapse" data-bs-parent="#management-accordion">
                    <div class="accordion-body">
                        <button class="btn btn-primary" id="export-csv-btn">
                            <i class="bi bi-download me-1"></i> Exportar CSV
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </main>

</body>

</html>
